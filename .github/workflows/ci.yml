name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The binary must stay static and cross-compilable; see docs/specs/adr/0002-metadata-store.md.
  CGO_ENABLED: "0"

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      # build vet test — the one command that must stay green.
      - run: make check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
